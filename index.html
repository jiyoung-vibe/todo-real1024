<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이번 주 가게 준비</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>이번 주 가게 준비</h1>

  <div>
    <input type="text" id="todo-input" placeholder="할 일 적기">
    <button type="button" id="add-button">추가</button>
  </div>

  <ul id="todo-list">
    <!--
      할 일 한 개의 모양 (JavaScript로 목록에 채울 때 쓸 자리)
      <li>
        <input type="checkbox">
        <span>할 일 내용</span>
        <button type="button">삭제</button>
      </li>
    -->
  </ul>

  <p>남은 할 일 <span id="remaining-count">0</span>개</p>
</body>
</html>
